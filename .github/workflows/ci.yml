name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# В PR новый push отменяет устаревший прогон. На main, по расписанию и вручную
# каждый прогон доходит до конца: у него своя группа (run_id).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Ruff, mypy, служебные проверки
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Установить зависимости
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: mypy
      - name: Контакты в README синхронизированы
        run: python sync_app_metadata.py --check
      - name: В репозитории нет данных, ключей и локальных настроек
        run: git ls-files -z | xargs -0 python scripts/check_forbidden_files.py

  tests-linux:
    name: Тесты (ubuntu, SQLite + PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chimera
          POSTGRES_PASSWORD: chimera-ci
          POSTGRES_DB: chimera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chimera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql+psycopg://chimera:chimera-ci@localhost:5432/chimera_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Установить зависимости
        run: python -m pip install -e ".[dev]"
      - name: Миграции на чистой SQLite и проверка моделей
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/migrations-check.db
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Миграции на чистой PostgreSQL и проверка моделей
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: pytest (SQLite)
        run: pytest
      - name: pytest (PostgreSQL)
        env:
          CHIMERA_TEST_DATABASE_URL: ${{ env.PG_URL }}
        run: pytest

  tests-windows:
    name: Тесты (windows, SQLite)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Установить зависимости
        run: python -m pip install -e ".[dev]"
      - name: Миграции на чистой SQLite и проверка моделей
        shell: bash
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/migrations-check.db
        run: |
          alembic upgrade head
          alembic check
      - name: pytest
        run: pytest

  docker:
    name: Docker-образ (сборка и запуск)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Сгенерировать одноразовый .env
        run: |
          python3 - <<'PY'
          import base64, os, secrets
          values = {
              "SECRET_KEY": secrets.token_urlsafe(48),
              "DATA_ENCRYPTION_KEY": base64.urlsafe_b64encode(os.urandom(32)).decode(),
              "POSTGRES_PASSWORD": secrets.token_urlsafe(24),
              "ADMIN_DEFAULT_PASSWORD": "Ci-" + secrets.token_urlsafe(16) + "-9",
              "SESSION_COOKIE_SECURE": "false",
          }
          with open(".env", "w", encoding="utf-8") as fh:
              fh.writelines(f"{k}={v}\n" for k, v in values.items())
          PY
      - name: Собрать и запустить docker compose
        run: >-
          docker compose -f deploy/docker-compose.yml --env-file .env
          up -d --build --wait --wait-timeout 300
      - name: Проверить приложение через nginx
        run: |
          code=$(curl -s -o login.html -w '%{http_code}' -D headers.txt http://localhost/login)
          test "$code" = "200"
          grep -q 'Chimera' login.html
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^x-frame-options: DENY' headers.txt
      - name: Проверить содержимое образа
        run: |
          compose="docker compose -f deploy/docker-compose.yml --env-file .env"
          $compose exec -T app python -m chimera status
          $compose exec -T app gunicorn --version
          $compose exec -T app pg_dump --version | grep -q ' 16\.'
          $compose exec -T app soffice --version
          $compose exec -T app fc-list | grep -qi 'Liberation Serif'
          $compose exec -T app sh -c 'test "$(id -u)" != 0'
      - name: Журналы контейнеров
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file .env logs --no-color
      - name: Остановить
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file .env down -v
