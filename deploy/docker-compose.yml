# Сервер Chimera: приложение + PostgreSQL 16 + nginx.
# Запуск из корня репозитория:
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
name: chimera

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chimera}
      POSTGRES_USER: ${POSTGRES_USER:-chimera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      CHIMERA_MODE: server
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chimera}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-chimera}
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - appdata:/var/lib/chimera
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  pgdata:
  appdata:
