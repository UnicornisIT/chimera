# PostgreSQL 16 для ручной локальной разработки:
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   DATABASE_URL=postgresql+psycopg://chimera:chimera-dev@localhost:5433/chimera
# Для pytest используйте отдельный кластер: pytest --chimera-postgres.
name: chimera-dev

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: chimera
      POSTGRES_USER: chimera
      POSTGRES_PASSWORD: chimera-dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

volumes:
  pgdata-dev:
