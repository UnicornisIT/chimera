# PostgreSQL 16 для локальной разработки и прогона тестов:
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   DATABASE_URL=postgresql+psycopg://chimera:chimera-dev@localhost:5433/chimera
#   CHIMERA_TEST_DATABASE_URL=postgresql+psycopg://chimera:chimera-dev@localhost:5433/chimera_test
name: chimera-dev

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: chimera
      POSTGRES_USER: chimera
      POSTGRES_PASSWORD: chimera-dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./dev-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro

volumes:
  pgdata-dev:
