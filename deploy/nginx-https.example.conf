# Пример nginx на хосте (systemd-установка), HTTPS + HSTS.
# Приложение слушает 127.0.0.1:8000 (см. systemd/chimera.service).
server {
    listen 80;
    server_name chimera.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name chimera.example.org;

    ssl_certificate     /etc/letsencrypt/live/chimera.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chimera.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300;
    }

    location /static/ {
        alias /srv/chimera/chimera/static/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
