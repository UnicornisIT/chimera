{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="error-page">
    <p class="error-code">{{ code }}</p>
    <h1>{{ title }}</h1>
    {% if message %}<p>{{ message }}</p>{% endif %}
    <p><a class="btn" href="{{ url_for('main.dashboard') }}">На главную</a></p>
</div>
{% endblock %}
