[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unicornisit-chimera"
dynamic = ["version"]
description = "Curator workspace for university and college study groups: student records and document generation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "UnicornisIT" }]
keywords = ["curator", "education", "flask", "postgresql", "sqlalchemy", "student-records"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Flask",
    "Intended Audience :: Education",
    "Natural Language :: Russian",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "Flask>=3.1.3,<4.0",
    "Werkzeug>=3.1.9,<4.0",
    "SQLAlchemy>=2.0.40,<2.1",
    "alembic>=1.16,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "cryptography>=50.0.2,<51.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/UnicornisIT/chimera"
Documentation = "https://github.com/UnicornisIT/chimera/tree/main/docs"
Changelog = "https://github.com/UnicornisIT/chimera/blob/main/CHANGELOG.md"
Issues = "https://github.com/UnicornisIT/chimera/issues"

[project.optional-dependencies]
prod = [
    "gunicorn>=23.0,<24.0",
]
desktop = [
    "pywebview>=5.0,<7.0",
    "pystray>=0.19.5,<0.20",
    "Pillow>=13.0,<14.0",
    "pyinstaller>=6.0,<7.0",
]
dev = [
    "Faker>=37.0",
    "mypy>=1.14,<3.0",
    "pip-audit>=2.7,<3.0",
    "pre-commit>=4.0,<5.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.11,<1.0",
]

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.setuptools.packages.find]
include = ["chimera*"]

[tool.setuptools.package-data]
chimera = ["templates/**/*", "static/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", ".venv-*", "build", "dist", "uploads", "instance"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = [
    "RUF001", # кириллица в строках интерфейса — норма
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"migrations/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
files = ["chimera", "scripts", "sync_app_metadata.py"]
warn_unused_configs = true
show_error_codes = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["chimera.core.*", "chimera.services.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
